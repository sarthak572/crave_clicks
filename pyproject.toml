[project]
name = "cafepos"
version = "0.1.0"
description = "Offline desktop point-of-sale application for a single cafe"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6,<7",
]

[project.scripts]
cafepos = "app.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
